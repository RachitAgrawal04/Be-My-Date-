<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hi Jupiter 🌹</title>

    <!-- SEO -->
    <meta name="description" content="A tiny corner of the internet, just for you 🌹">
    <meta property="og:title" content="Hi Jupiter 🌹">
    <meta property="og:description"
        content="Will u be someone i can ragebait all day, forever? Will u be my love... love?">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <!-- ═══════════════════════════════════════ -->
    <!-- FLOATING PARTICLES CONTAINER           -->
    <!-- ═══════════════════════════════════════ -->
    <div id="particles-container" class="particles-container"></div>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCREEN 0: INTRO / TAP TO BEGIN         -->
    <!-- ═══════════════════════════════════════ -->
    <section id="screen-intro" class="screen screen-intro active">
        <div class="intro-content">
            <div class="intro-envelope" id="intro-envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-body">
                    <div class="envelope-heart">💌</div>
                </div>
            </div>
            <h1 class="intro-title">You have something special...</h1>
            <p class="intro-tap">tap anywhere to open</p>
        </div>
    </section>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCREEN 1-3: STORY SCREENS              -->
    <!-- (generated dynamically by app.js)      -->
    <!-- ═══════════════════════════════════════ -->
    <div id="story-screens-container"></div>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCREEN: PHOTO MEMORIES                 -->
    <!-- ═══════════════════════════════════════ -->
    <section id="screen-photos" class="screen screen-photos">
        <div class="photos-content">
            <h2 class="section-title">Our Moments ✨</h2>
            <p class="section-subtitle">A few little pieces of you I keep close.</p>
            <div class="photos-grid" id="photos-grid">
                <!-- Generated by app.js -->
            </div>
            <button class="continue-btn" id="photos-continue">Continue 💕</button>
        </div>
    </section>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCREEN: OPEN WHEN ENVELOPES            -->
    <!-- ═══════════════════════════════════════ -->
    <section id="screen-envelopes" class="screen screen-envelopes">
        <div class="envelopes-content">
            <h2 class="section-title">Wrote these for you 💌</h2>
            <p class="section-subtitle">Tap each one to open</p>
            <div class="envelopes-grid" id="envelopes-grid">
                <!-- Generated by envelopes.js -->
            </div>
            <button class="continue-btn" id="envelopes-continue">I have one more thing... 💕</button>
        </div>
    </section>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCREEN: THE QUESTION                   -->
    <!-- ═══════════════════════════════════════ -->
    <section id="screen-question" class="screen screen-question">
        <div class="question-card" id="main-card">
            <div class="question-icon">
                <img id="main-gif" src="" alt="Love" class="main-gif">
            </div>
            <h1 class="question-text" id="question-text"></h1>
            <p class="question-subtitle" id="question-subtitle"></p>
            <div class="question-actions" id="question-actions">
                <button id="yes-btn" class="btn-yes">Yes</button>
                <button id="no-btn" class="btn-no">No</button>
            </div>
            <p id="no-hint" class="hint hidden">"No" seems a bit shy 💖</p>
        </div>
    </section>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCREEN: CELEBRATION                    -->
    <!-- ═══════════════════════════════════════ -->
    <section id="screen-celebration" class="screen screen-celebration">
        <div class="celebration-content" id="celebration-content">
            <img id="celebration-gif" src="" alt="Celebration" class="celebration-gif">
            <h1 class="celebration-title">She said YES!!! 🎉</h1>
            <p class="celebration-message" id="celebration-message"></p>
            <button id="view-collage-btn" class="view-collage-btn hidden">
                📸 View Our Photos
            </button>
        </div>
    </section>

    <!-- ═══════════════════════════════════════ -->
    <!-- LOVE NOTE NOTIFICATION                 -->
    <!-- ═══════════════════════════════════════ -->
    <div id="note-notification" class="note-notification hidden">
        <div class="note-icon">💌</div>
        <span>You have a love note!</span>
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- LOVE NOTE POPUP                        -->
    <!-- ═══════════════════════════════════════ -->
    <div id="note-popup" class="note-popup hidden">
        <div class="note-paper">
            <button class="note-close" id="close-note">&times;</button>
            <div class="note-content">
                <div class="note-handwriting" id="note-handwriting"></div>
                <div class="note-signoff">
                    <span id="note-signoff-text"></span><br>
                    <span id="note-signoff-name" class="note-signoff-name"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- ENVELOPE MESSAGE POPUP                 -->
    <!-- ═══════════════════════════════════════ -->
    <div id="envelope-popup" class="note-popup hidden">
        <div class="note-paper envelope-paper">
            <button class="note-close" id="close-envelope">&times;</button>
            <div class="note-content">
                <h3 class="envelope-popup-title" id="envelope-popup-title"></h3>
                <div class="note-handwriting" id="envelope-message"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- MUSIC PLAYER (FLOATING)                -->
    <!-- ═══════════════════════════════════════ -->
    <button id="music-toggle-btn" class="music-toggle-btn hidden">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5L21 3V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2" />
            <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2" />
        </svg>
    </button>

    <div id="spotify-player" class="spotify-player hidden">
        <div class="spotify-player-inner">
            <div class="spotify-header">
                <span class="spotify-label">🎵 Our Song</span>
                <button id="close-music-btn" class="spotify-close">&times;</button>
            </div>
            <div class="spotify-embed">
                <iframe id="spotify-iframe" style="border-radius: 8px; width: 100%; height: 152px; border: none;" src=""
                    frameBorder="0" allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
                </iframe>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- NAVIGATION DOTS                        -->
    <!-- ═══════════════════════════════════════ -->
    <div id="nav-dots" class="nav-dots hidden">
        <!-- Generated by app.js -->
    </div>

    <!-- ═══════════════════════════════════════ -->
    <!-- SCRIPTS                                -->
    <!-- ═══════════════════════════════════════ -->
    <script src="config.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/envelopes.js"></script>
    <script src="js/no-button.js"></script>
    <script src="js/celebration.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
