<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A tiny interactive universe that exists because of us.">
    <meta name="theme-color" content="#0a0608">
    <title>For Jupiter 🌻</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Quicksand:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body class="phase-dark">
    <svg class="web-bg" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="0" y1="0" x2="100" y2="100" />
        <line x1="100" y1="0" x2="0" y2="100" />
        <line x1="50" y1="0" x2="50" y2="100" />
        <line x1="0" y1="50" x2="100" y2="50" />
        <line x1="0" y1="20" x2="100" y2="80" />
        <line x1="0" y1="80" x2="100" y2="20" />
    </svg>

    <div id="particles-container" class="particles-container" aria-hidden="true"></div>
    <div id="clue-counter" class="clue-counter" aria-live="polite"></div>
    <main id="app" aria-live="polite"></main>

    <div id="popup" class="popup-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="popup-title">
        <div class="popup-content">
            <button id="popup-close" class="popup-close" type="button" aria-label="Close">×</button>
            <h2 id="popup-title" class="popup-title"></h2>
            <div id="popup-body" class="popup-body"></div>
        </div>
    </div>

    <button id="music-toggle" class="music-toggle-btn" type="button" aria-label="Open our song" title="Our song">
        <span aria-hidden="true">♫</span>
    </button>
    <div id="music-player" class="spotify-player hidden" aria-label="Our song player">
        <div class="spotify-player-inner">
            <div class="spotify-header">
                <span class="spotify-label">Our song</span>
                <button id="music-close" class="spotify-close" type="button" aria-label="Close music player">×</button>
            </div>
            <div class="spotify-embed">
                <iframe id="spotify-iframe" title="Our song on Spotify" style="border:0; width:100%; height:152px;"
                    loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="content.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
